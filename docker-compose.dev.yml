services:
  qr-scanner-ui:
    build:
      context: ../Deamon-ui/qr-scanner-ui
      dockerfile: Dockerfile
      target: dev
    environment:
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "300"
      VITE_DEV_HOST: 0.0.0.0
      VITE_DEV_PORT: "80"
      VITE_ALLOWED_HOSTS: all
      VITE_SCAN_LINK_API_PROXY_TARGET: http://scan-link-backend:8095
    volumes:
      - ../Deamon-ui/qr-scanner-ui:/app
      - /app/node_modules
