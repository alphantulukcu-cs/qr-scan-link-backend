services:
  postgres:
    image: postgres:16-alpine
    container_name: scan-link-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: scan_link_backend
    ports:
      - "5433:5432"
    volumes:
      - scan_link_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d scan_link_backend"]
      interval: 5s
      timeout: 5s
      retries: 10

  scan-link-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scan-link-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      APP_ADDR: 0.0.0.0:8095
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/scan_link_backend
    ports:
      - "8095:8095"

  branch-intel-ui:
    build:
      context: ../Deamon-ui/branch-intel-ui
      dockerfile: Dockerfile
    container_name: branch-intel-ui
    restart: unless-stopped
    depends_on:
      - scan-link-backend
    ports:
      - "8081:80"

  qr-scanner-ui:
    build:
      context: ../Deamon-ui/qr-scanner-ui
      dockerfile: Dockerfile
    container_name: qr-scanner-ui
    restart: unless-stopped
    depends_on:
      - scan-link-backend
    ports:
      - "8082:80"

  nginx-https:
    image: nginx:1.27-alpine
    container_name: scan-link-nginx-https
    restart: unless-stopped
    depends_on:
      - scan-link-backend
      - qr-scanner-ui
    ports:
      - "8443:8443"
    volumes:
      - ./nginx/https.conf:/etc/nginx/conf.d/default.conf:ro
      - ../Deamon-ui/qr-scanner-ui/ssl:/etc/nginx/ssl:ro

volumes:
  scan_link_postgres_data:
