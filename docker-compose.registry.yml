services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    container_name: scan-link-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-scan_link_backend}
    ports:
      - "5432:5432"
    volumes:
      - scan_link_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-scan_link_backend}"]
      interval: 5s
      timeout: 5s
      retries: 10

  scan-link-backend:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}
    pull_policy: always
    container_name: scan-link-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      APP_ADDR: 0.0.0.0:8095
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@postgres:5432/scan_link_backend}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8081,http://localhost:8082}
    ports:
      - "8095:8095"

  branch-intel-ui:
    image: ${BRANCH_INTEL_UI_IMAGE:?BRANCH_INTEL_UI_IMAGE is required}
    pull_policy: always
    container_name: branch-intel-ui
    restart: unless-stopped
    depends_on:
      - scan-link-backend
    ports:
      - "8081:80"

  qr-scanner-ui:
    image: ${QR_SCANNER_UI_IMAGE:?QR_SCANNER_UI_IMAGE is required}
    pull_policy: always
    container_name: qr-scanner-ui
    restart: unless-stopped
    depends_on:
      - scan-link-backend
    ports:
      - "8082:80"

volumes:
  scan_link_postgres_data:
